<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>二百四</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
 * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
 *  CSS 架构说明
 * ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
 * 使用 CSS 变量（:root）统一管理颜色系统，分为：
 *   - 背景层：--bg（最深）→ --s1 → --s2 → --s3（最浅）
 *   - 边框层：--b1（淡）→ --b2（稍亮）
 *   - 主题色：--blue（交互）、--gold（副主/得分）、--red（错误）、--green（成功）
 *   - 文字层：--t1（主文字）→ --t2（次要）→ --t3（更弱）
 */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e13;--s1:#13161f;--s2:#1a1e2a;--s3:#252a3a;
  --b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.14);
  --blue:#5b9bd5;--blue2:#3a7abf;
  --red:#e05a5a;--gold:#d4a843;--gold2:#a07828;--green:#52c27a;
  --t1:#edf0f7;--t2:#8a91a8;--t3:#3a3f55;
}
html,body{width:100%;height:100%;overflow:hidden;user-select:none;background:var(--bg)}
body{font-family:'Sora','Noto Sans SC',sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased}

/* 通用工具类：.hide 将元素完全隐藏（!important 防止被其他规则覆盖） */
.hide{display:none!important}

/* 全屏居中容器，用于大厅、结算等覆盖层 */
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

/* ── 大厅界面 ── */
#lobby{background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(91,155,213,.08),transparent)}
.lbox{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:44px 48px;width:360px;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:46px;font-weight:700;letter-spacing:3px}
.logo h1 em{color:var(--gold);font-style:normal}  /* "四"字用金色强调 */
.logo p{font-size:11px;color:var(--t2);letter-spacing:3px;margin-top:5px}
.sep{height:1px;background:var(--b1);margin:16px 0}

/* ── 通用按钮系统 ── */
/* .btn 是基础类，配合修饰类使用：-primary（蓝色主操作）、-ghost（次要）、-gold（强调）、-red（危险） */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 18px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all .14s;white-space:nowrap}
.btn:active{transform:scale(.97)}    /* 点击时缩小反馈 */
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
.btn-primary{background:var(--blue);color:#06101e}.btn-primary:hover:not(:disabled){filter:brightness(1.12)}
.btn-ghost{background:var(--s2);color:var(--t1);border:1px solid var(--b2)}.btn-ghost:hover:not(:disabled){background:var(--s3)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a0e00}.btn-gold:hover{filter:brightness(1.1)}
.btn-red{background:#6e2020;color:#ffd0d0;border:1px solid rgba(224,90,90,.25)}.btn-red:hover{background:var(--red);color:#fff}
.btn-block{width:100%}

/* ── 游戏主界面（绝对定位布局） ── */
#game{position:fixed;inset:0}

/* 顶栏：渐变遮罩，确保不遮挡牌区 */
#topbar{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:10px;padding:9px 16px;background:linear-gradient(180deg,rgba(12,14,19,.95),transparent)}
.gtitle{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--t2)}
.chips{display:flex;gap:6px;margin-left:auto}  /* 信息胶囊靠右排列 */
.chip{background:var(--s1);border:1px solid var(--b1);border-radius:18px;padding:3px 11px;font-size:11px;color:var(--t2);display:flex;align-items:center;gap:4px}
.chip .cv{font-weight:700;font-size:13px;color:var(--t1)}
.cv.pos{color:var(--green)!important}.cv.neg{color:var(--red)!important}.cv.gold{color:var(--gold)!important}

/*
 * ── 玩家区域布局 ──
 * 四名玩家分布在屏幕四个方向：
 *   - 座位 0（你）：底部，#z-bottom
 *   - 座位 1（AI一）：右侧，#z-right
 *   - 座位 2（AI二）：顶部，#z-top
 *   - 座位 3（AI三）：左侧，#z-left
 * 使用绝对定位 + transform 居中对齐各区域
 */
.pzone{position:absolute;display:flex;align-items:center}
#z-top{top:50px;left:50%;transform:translateX(-50%);flex-direction:column;align-items:center;gap:4px}
#z-left{left:2px;top:50%;transform:translateY(-50%);flex-direction:column;align-items:flex-start;gap:4px}
#z-right{right:2px;top:50%;transform:translateY(-50%);flex-direction:column;align-items:flex-end;gap:4px}
#z-bottom{bottom:0;left:0;right:0;flex-direction:column;align-items:center}

/* 玩家名牌：毛玻璃效果，当前出牌时亮蓝边框 */
.ptag{display:flex;align-items:center;gap:6px;background:rgba(19,22,31,.92);border:1px solid var(--b1);border-radius:20px;padding:4px 11px;transition:border-color .25s,box-shadow .25s;backdrop-filter:blur(8px)}
.ptag.active{border-color:var(--blue2);box-shadow:0 0 10px rgba(91,155,213,.2)}
.ptag .pn{font-size:12px;font-weight:600;white-space:nowrap}
.ptag .ps{font-size:11px;color:var(--t2)}
/* 轮到该玩家出牌时显示的蓝色闪烁圆点 */
.tdot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 5px var(--blue);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hcnt{font-size:10px;color:var(--t2);background:var(--s2);border:1px solid var(--b1);border-radius:7px;padding:2px 7px}
/* 角色标签：喊牌（金色）或反牌（蓝色）时显示 */
.rpill{font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px}
.rp-shout{background:rgba(212,168,67,.15);color:var(--gold);border:1px solid rgba(212,168,67,.3)}
.rp-rev{background:rgba(91,155,213,.15);color:var(--blue);border:1px solid rgba(91,155,213,.3)}

/*
 * ── 手牌渲染布局 ──
 * 底部（人类）：横向展开，可点击，支持选中上移效果
 * 顶部（AI二）：横向折叠，小尺寸背面牌
 * 左/右侧（AI三/AI一）：纵向折叠，横版背面牌
 */
#hand-top{display:flex;flex-direction:row}
#hand-left{display:flex;flex-direction:column}
#hand-right{display:flex;flex-direction:column}
.hwrap{display:flex;justify-content:center;align-items:flex-end;padding:8px 10px 10px}
#hand-bottom{display:flex;align-items:flex-end;justify-content:center}

/* 基础牌样式 */
.card{width:56px;height:80px;background:#fff;border-radius:7px;border:1px solid rgba(0,0,0,.15);box-shadow:0 2px 8px rgba(0,0,0,.45);position:relative;flex-shrink:0;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s}

/* 顶部 AI 手牌：小尺寸横向叠放（仅露出左边缘） */
#hand-top .card{width:19px;height:29px;margin-left:-11px}
#hand-top .card:first-child{margin-left:0}

/* 左/右 AI 手牌：横版，纵向叠放 */
#hand-left .card{width:28px;height:19px;margin-top:-9px}
#hand-left .card:first-child{margin-top:0}
#hand-right .card{width:28px;height:19px;margin-top:-9px}
#hand-right .card:first-child{margin-top:0}

/* 底部人类手牌：可交互，hover上浮，选中时高亮上移 */
#hand-bottom .card{margin-left:-19px;cursor:pointer}
#hand-bottom .card:first-child{margin-left:0}
#hand-bottom .card:hover{transform:translateY(-10px);z-index:5;box-shadow:0 10px 20px rgba(0,0,0,.5)}
#hand-bottom .card.sel{transform:translateY(-22px)!important;box-shadow:0 0 0 2px var(--blue),0 14px 24px rgba(91,155,213,.3)!important;z-index:6}
#hand-bottom .card.hint-hl{box-shadow:0 0 0 2px var(--gold),0 6px 16px rgba(212,168,67,.3)!important}

/* 背面牌样式：深色渐变 + 斜纹图案 */
.card.back{background:linear-gradient(135deg,#181d30,#212640);cursor:default}
.card.back::after{content:'';position:absolute;inset:3px;border:1px solid rgba(255,255,255,.05);border-radius:4px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0,rgba(255,255,255,.015) 2px,transparent 2px,transparent 8px)}

/* 牌面文字布局：左上角（.cc）+ 中央（.cct）+ 右下角（.ccb，旋转180°） */
.cc{position:absolute;top:2px;left:3px;line-height:1;display:flex;flex-direction:column;align-items:center}
.ccb{top:auto;bottom:2px;left:auto;right:3px;transform:rotate(180deg)}
.cr{font-size:12px;font-weight:800}  /* 牌值（A/K/Q... 数字） */
.cs{font-size:8px}                   /* 花色符号（小） */
.cct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px}  /* 中央大花色 */
.cred{color:#dc2626}.cblk{color:#111}
.jtag{font-size:5px;font-weight:900;letter-spacing:.5px}  /* 王牌"王"字标签 */

/* 发牌入场动画：从上方淡入下落 */
@keyframes dealIn{from{opacity:0;transform:translateY(-20px) scale(.85)}to{opacity:1;transform:none}}
.dealing{animation:dealIn .16s ease-out forwards}

/* ── 中央信息区 ── */
/* 绝对居中，pointer-events:none 防止遮挡点击 */
#tcenter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:380px;pointer-events:none;z-index:10}
#statusbar{background:rgba(19,22,31,.93);border:1px solid var(--b1);border-radius:10px;padding:6px 15px;font-size:12px;color:var(--t2);text-align:center;backdrop-filter:blur(8px);min-width:200px}
#statusbar b{color:var(--t1)}

/*
 * ── 本轮出牌展示区（#round-plays）──
 * 使用 3 行 2 列的 CSS Grid：
 *   行1（.rp-top）   ：AI二（正上方，跨两列）
 *   行2左（.rp-left）：AI三（左侧）
 *   行2右（.rp-right）：AI一（右侧）
 *   行3（.rp-bottom）：你（正下方，跨两列）
 */
#round-plays{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:6px;width:100%}
.rplay{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;padding:3px}
.rp-top{grid-column:1/3;grid-row:1;align-items:center}
.rp-left{grid-column:1;grid-row:2}
.rp-right{grid-column:2;grid-row:2;align-items:flex-end}
.rp-bottom{grid-column:1/3;grid-row:3;align-items:center}
.rplay-pile{display:flex;justify-content:center}
.rplay-pile .card{width:42px;height:60px;margin-left:-10px}
.rplay-pile .card:first-child{margin-left:0}
.rplay-meta{font-size:10px;color:var(--t2)}
/* 本轮获胜者的牌堆：金色光晕高亮 */
.rplay.win-hl .rplay-pile .card{box-shadow:0 0 0 2px var(--gold),0 4px 14px rgba(212,168,67,.4)!important}

/* ── 喊牌面板（发牌阶段浮现）── */
/* 当人类玩家第一次获得10时出现，发牌不暂停，面板实时更新可喊花色 */
#shout-panel{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(19,22,31,.97);border:1px solid rgba(212,168,67,.25);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 16px 32px rgba(0,0,0,.5);backdrop-filter:blur(12px);z-index:50;min-width:280px}
.shout-lbl{font-size:11px;color:var(--t2)}
#shout-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* 无人喊牌后的倒计时提示条（5秒后自动打正主） */
#countdown-bar{position:absolute;bottom:136px;left:50%;transform:translateX(-50%);background:rgba(212,168,67,.12);border:1px solid rgba(212,168,67,.3);border-radius:20px;padding:5px 18px;font-size:13px;color:var(--gold);font-weight:700;z-index:50;pointer-events:none;text-align:center}

/* 反牌面板（反牌阶段，轮到玩家时出现） */
#rev-panel{position:absolute;bottom:136px;left:50%;transform:translateX(-50%);background:rgba(19,22,31,.97);border:1px solid var(--b1);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;box-shadow:0 16px 32px rgba(0,0,0,.5);backdrop-filter:blur(12px);z-index:50}
.fl{font-size:11px;color:var(--t2)}

/* 出牌操作栏（仅在人类出牌回合显示） */
#action-bar{position:absolute;bottom:116px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:40}

/* ── Toast 提示系统 ── */
/* 提示从顶部中央弹出，支持金/红/绿三种语义颜色 */
#toasts{position:fixed;top:52px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;z-index:200;pointer-events:none}
.toast{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:5px 14px;font-size:12px;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:tsin .26s cubic-bezier(.34,1.56,.64,1)}
.toast.out{animation:tsout .2s forwards}
.tgold{border-color:rgba(212,168,67,.4);color:var(--gold)}
.tred{border-color:rgba(224,90,90,.4);color:var(--red)}
.tgreen{border-color:rgba(82,194,122,.3);color:var(--green)}
@keyframes tsin{from{opacity:0;transform:translateY(-5px) scale(.92)}to{opacity:1;transform:none}}
@keyframes tsout{to{opacity:0;transform:translateY(-5px) scale(.92)}}

/* ── 结算界面 ── */
#endlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center}
.ebox{background:var(--s1);border:1px solid var(--b1);border-radius:22px;padding:32px 40px;width:390px;text-align:center;animation:popIn .38s cubic-bezier(.34,1.56,.64,1);box-shadow:0 40px 80px rgba(0,0,0,.7)}
@keyframes popIn{from{opacity:0;transform:scale(.76)}to{opacity:1;transform:none}}
.eemoji{font-size:44px;margin-bottom:5px}
.etitle{font-size:22px;font-weight:700;margin-bottom:3px}
.etitle.win{color:var(--gold)}.etitle.lose{color:var(--red)}.etitle.tie{color:var(--blue)}
.stbl{width:100%;border-collapse:collapse;margin:12px 0}
.stbl th{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;padding:4px;border-bottom:1px solid var(--b1)}
.stbl td{font-size:12px;padding:6px 4px;border-bottom:1px solid var(--b1);color:var(--t2)}
.stbl .you{color:var(--t1);font-weight:700}
.pos{color:var(--green)}.neg{color:var(--red)}
.eacts{display:flex;gap:8px;justify-content:center;margin-top:5px}
/* 出牌错误时手牌区抖动动画 */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.shake{animation:shake .28s}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     大厅界面：游戏入口，点击"开始游戏"进入
     ══════════════════════════════════════════ -->
<div class="scr" id="lobby">
  <div class="lbox">
    <div class="logo"><h1>二百<em>四</em></h1><p>四人捡分 · 人机对战</p></div>
    <div class="sep"></div>
    <button class="btn btn-primary btn-block" onclick="startGame()">开始游戏</button>
    <div class="sep"></div>
    <p style="font-size:10px;color:var(--t3);text-align:center">你 vs AI×3 · 84张牌 · 总分240分</p>
  </div>
</div>

<!-- ══════════════════════════════════════════
     游戏主界面：绝对定位布局，四名玩家分布四方
     ══════════════════════════════════════════ -->
<div class="scr hide" id="game">

  <!-- 顶栏：游戏标题 + 信息胶囊（副主花色 / 局数 / 本局得分 / 累计） -->
  <div id="topbar">
    <div class="gtitle">二百四</div>
    <div class="chips">
      <div class="chip">副主&nbsp;<span class="cv gold" id="c-sub">—</span></div>
      <div class="chip">第<span class="cv" id="c-rnd">1</span>局</div>
      <div class="chip">你&nbsp;<span class="cv" id="c-score">0分</span></div>
      <div class="chip">累计&nbsp;<span class="cv" id="c-cum">±0</span></div>
    </div>
  </div>

  <!-- 座位2（AI二）：屏幕正上方 -->
  <div class="pzone" id="z-top">
    <div class="ptag" id="pt-2">
      <div class="tdot hide" id="td-2"></div>  <!-- 出牌指示灯 -->
      <span class="pn">AI二</span>
      <span class="ps" id="ps-2">0分</span>
      <span class="rpill hide" id="pr-2"></span>  <!-- 喊牌/反牌标签 -->
    </div>
    <div class="hcnt" id="hc-2">0张</div>  <!-- 手牌数量 -->
    <div id="hand-top"></div>              <!-- 手牌渲染容器 -->
  </div>

  <!-- 座位3（AI三）：屏幕左侧 -->
  <div class="pzone" id="z-left">
    <div class="ptag" id="pt-3">
      <div class="tdot hide" id="td-3"></div>
      <span class="pn">AI三</span>
      <span class="ps" id="ps-3">0分</span>
      <span class="rpill hide" id="pr-3"></span>
    </div>
    <div class="hcnt" id="hc-3">0张</div>
    <div id="hand-left"></div>
  </div>

  <!-- 座位1（AI一）：屏幕右侧 -->
  <div class="pzone" id="z-right">
    <div class="ptag" id="pt-1">
      <div class="tdot hide" id="td-1"></div>
      <span class="pn">AI一</span>
      <span class="ps" id="ps-1">0分</span>
      <span class="rpill hide" id="pr-1"></span>
    </div>
    <div class="hcnt" id="hc-1">0张</div>
    <div id="hand-right"></div>
  </div>

  <!-- 中央信息区：状态栏 + 本轮出牌展示 -->
  <div id="tcenter">
    <div id="statusbar">准备中...</div>
    <div id="round-plays"></div>  <!-- 四人本轮出牌的卡片区，CSS Grid 布局 -->
  </div>

  <!-- 座位0（你）：屏幕底部 -->
  <div class="pzone" id="z-bottom">
    <div class="ptag" id="pt-0" style="margin-bottom:5px">
      <div class="tdot hide" id="td-0"></div>
      <span class="pn">你</span>
      <span class="ps" id="ps-0">0分</span>
      <span class="rpill hide" id="pr-0"></span>
    </div>
    <div class="hwrap"><div id="hand-bottom"></div></div>
  </div>

  <!-- 喊牌面板：发牌阶段当玩家获得10时出现，按花色分按钮 -->
  <div id="shout-panel" class="hide">
    <div class="shout-lbl">你有10，可以喊副主（喊后本花色成为主牌）</div>
    <div id="shout-btns"></div>  <!-- 动态生成花色按钮 -->
  </div>

  <!-- 无人喊牌后的5秒倒计时条 -->
  <div id="countdown-bar" class="hide"></div>

  <!-- 反牌面板：反牌阶段轮到玩家时出现，列出可以反的选项 -->
  <div id="rev-panel" class="hide">
    <span class="fl">反牌：</span>
    <!-- 每个按钮对应一种反法，由 showRevPanel() 动态设置 disabled 状态 -->
    <button class="btn btn-ghost" id="rb-bj" onclick="humanRev('bigjoker')">大王对</button>
    <button class="btn btn-ghost" id="rb-sj" onclick="humanRev('smalljoker')">小王对</button>
    <button class="btn btn-ghost" id="rb-sp" onclick="humanRev('♠')">♠10对</button>
    <button class="btn btn-ghost" id="rb-hp" onclick="humanRev('♥')">♥10对</button>
    <button class="btn btn-ghost" id="rb-cp" onclick="humanRev('♣')">♣10对</button>
    <button class="btn btn-ghost" id="rb-dp" onclick="humanRev('♦')">♦10对</button>
    <button class="btn btn-red"   onclick="humanRev(null)">过</button>  <!-- 放弃反牌 -->

  <div id="action-bar" class="hide">
    <button class="btn btn-ghost" onclick="doHint()">💡 提示</button>  <!-- 循环提示可出牌型 -->

     结算界面：每局结束后显示得分和变化
     ══════════════════════════════════════════ -->
<div id="endlay" class="hide">
  <div class="ebox">
    <div class="eemoji" id="e-emoji">🎉</div>
    <div class="etitle" id="e-title">游戏结束</div>
    <div style="font-size:11px;color:var(--t2);margin-top:3px" id="e-sub"></div>

    <table class="stbl">
      <thead><tr><th>玩家</th><th>得分</th><th>本局±</th><th>累计</th></tr></thead>
      <tbody id="e-tbody"></tbody>
    </table>
    <div class="eacts">
      <button class="btn btn-gold" onclick="nextRound()">再来一局</button>
      <button class="btn btn-ghost" onclick="backLobby()">返回大厅</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块一：音效系统（Web Audio API）
//
//  使用原生 Web Audio API 合成音效，避免加载外部音频文件。
//  所有音效通过振荡器（OscillatorNode）+ 增益（GainNode）实现：
//    - 指定频率（f）、波形（t）、持续时间（d）、音量（v）、延迟（dl）
//    - 使用 exponentialRampToValueAtTime 实现自然衰减
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let _ac=null;

/**
 * 懒初始化 AudioContext（用户交互后才能创建）
 * 若被挂起（浏览器策略），自动恢复
 */
function ac(){
  if(!_ac) _ac=new(window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==='suspended') _ac.resume();
  return _ac;
}

/**
 * 合成单音
 * @param {number} f  - 频率（Hz）
 * @param {string} t  - 波形：'sine'（纯净）、'triangle'（柔和）、'square'（硬）等
 * @param {number} d  - 持续时间（秒）
 * @param {number} v  - 初始音量（0~1）
 * @param {number} dl - 延迟开始时间（秒），用于和弦叠加
 */
function tone(f,t,d,v,dl){
  try{
    const c=ac(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=t||'sine';o.frequency.value=f;
    const s=c.currentTime+(dl||0);
    g.gain.setValueAtTime(v||.1,s);
    g.gain.exponentialRampToValueAtTime(.001,s+(d||.1)); // 指数衰减到接近零
    o.start(s);o.stop(s+(d||.1));
  }catch(e){}
}

/** 音效集合：各游戏事件对应的音效组合 */
const SFX={
  deal:  ()=>tone(380,'sine',.03,.05),                                          // 发牌：短促低音
  pick:  ()=>tone(820,'sine',.04,.07),                                          // 选牌：中高音点击
  play:  ()=>{tone(540,'triangle',.06,.1);tone(720,'triangle',.05,.07,.06);},   // 出牌：双音
  shout: ()=>{tone(600,'sine',.1,.17);tone(900,'sine',.11,.17,.1);              // 喊牌/反牌：三音上升
               tone(1100,'sine',.13,.17,.22);},
  score: ()=>tone(680,'triangle',.1,.16),                                       // 得分：饱满三角波
  win:   ()=>[523,659,784,1047].forEach((f,i)=>tone(f,'sine',.26,.18,i*.13)),  // 胜利：C大调上行
  lose:  ()=>[380,330,280,230].forEach((f,i)=>tone(f,'sine',.2,.15,i*.17)),    // 失败：下行
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块二：牌组生成
//
//  二百四使用两副标准扑克牌，共 84 张：
//    - 4 花色 × 10 点数 × 2 副 = 80 张普通牌
//    - 大王 × 2 + 小王 × 2 = 4 张王牌
//  每张牌有唯一 uid，用于精确追踪（避免依赖对象引用）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const SUITS=['♠','♥','♣','♦'];
const NORMAL_RANKS=['A','2','5','7','8','9','10','J','Q','K'];
// 注意：3、4、6 不在二百四中使用

/**
 * 生成完整牌组（84 张），每张牌对象结构：
 * {
 *   suit:     '♠'|'♥'|'♣'|'♦'|'🃏'|'🎴'  花色（王牌用 Emoji）
 *   rank:     'A'|'2'|...|'K'|'大'|'小'   点数
 *   joker:    boolean                       是否为王牌
 *   jokerType:'big'|'small'                 王牌类型
 *   uid:      number                        全局唯一 ID（0-83）
 * }
 */
function makeDeck(){
  const base=[];
  for(const s of SUITS) for(const r of NORMAL_RANKS) base.push({suit:s,rank:r,joker:false});
  base.push({suit:'🃏',rank:'大',joker:true,jokerType:'big'});
  base.push({suit:'🃏',rank:'大',joker:true,jokerType:'big'});
  base.push({suit:'🎴',rank:'小',joker:true,jokerType:'small'});
  base.push({suit:'🎴',rank:'小',joker:true,jokerType:'small'});
  let uid=0;
  const deck=[];
  // 每张基础牌复制两份（两副牌）
  for(const c of base){
    deck.push({...c,uid:uid++});
    if(!c.joker) deck.push({...c,uid:uid++}); // 王牌已经各有2张，不需再复制
  }
  return deck;
}

/**
 * Fisher-Yates 洗牌算法（原地随机化）
 * @param {Array} a - 待洗牌数组
 * @returns {Array}  洗好的新数组
 */
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=0|Math.random()*(i+1);
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块三：牌的权值系统（Rank Tables）
//
//  二百四中牌的大小由以下层次决定：
//    1. 花色类别（suit category）：main > roundCat > others
//    2. 权值（rank）：由下方 cardRank() 计算
//
//  打正主时（sub=null）权值表：
//    5=1, 7=2, 8=3, 9=4, J=5, Q=6, K=7, A=8
//    ♦2=9, ♣2=10, ♥2=11, ♠2=12
//    ♦10=13, ♣10=14, ♥10=15, ♠10=16
//    小王=17, 大王=18
//
//  有副主（例如 sub='♥'）时权值表：
//    5=1, 7=2, 8=3, 9=4, J=5, Q=6, K=7, A=8
//    非副主的2=9, ♥2=10
//    非副主的10=11, ♥10=12
//    小王=13, 大王=14
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/**
 * 计算一张牌在当前副主设置下的权值
 * @param {Object} c   - 牌对象
 * @param {string} sub - 副主花色（null 表示打正主）
 * @returns {number}   权值，数值越大越大
 */
function cardRank(c,sub){
  if(c.joker) return c.jokerType==='big'?(sub?14:18):(sub?13:17);

  if(c.rank==='10'){
    if(!sub){
      // 打正主：四种10按 ♦♣♥♠ 升序排列（13~16）
      const i=['♦','♣','♥','♠'].indexOf(c.suit);
      return 13+i;
    }
    return c.suit===sub?12:11; // 有副主：副主10=12，其余10=11
  }

  if(c.rank==='2'){
    if(!sub){
      // 打正主：四种2按 ♦♣♥♠ 升序排列（9~12）
      const i=['♦','♣','♥','♠'].indexOf(c.suit);
      return 9+i;
    }
    return c.suit===sub?10:9;  // 有副主：副主2=10，其余2=9
  }

  // 普通点数（不区分花色）
  const t={5:1,7:2,8:3,9:4,J:5,Q:6,K:7,A:8};
  return t[c.rank]||0;
}

/**
 * 计算一张牌的花色类别（suit category）
 * 类别决定出牌时的强弱层次，main 最强
 *
 * @param {Object} c   - 牌对象
 * @param {string} sub - 副主花色（null 表示打正主）
 * @returns {string}   'main' 或 花色字符（'♠'|'♥'|'♣'|'♦'）
 *
 * 属于 main 的牌：
 *   - 大王、小王
 *   - 所有2（无论花色）
 *   - 所有10（无论花色）
 *   - 副主花色的普通牌（非2非10）
 */
function cardCat(c,sub){
  if(c.joker) return 'main';
  if(c.rank==='10'||c.rank==='2') return 'main';
  if(sub&&c.suit===sub) return 'main';
  return c.suit;
}

/**
 * 计算一张牌的分值（用于累计胜者得分）
 * 5=5分，10=10分，K=10分，大/小王=10分
 */
function cardScore(c){
  if(c.joker) return 10;
  if(c.rank==='10') return 10;
  if(c.rank==='K') return 10;
  if(c.rank==='5') return 5;
  return 0;
}

/** 计算一组牌的总分值 */
function totalScore(cards){
  return(cards||[]).reduce((s,c)=>s+cardScore(c),0);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块四：对子与连队检测
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/**
 * 判断两张牌是否构成一对
 * 对子条件：
 *   - 王牌：同类型（bigjoker-bigjoker 或 small-small）
 *   - 普通牌：点数相同且花色相同（两副牌中同一张）
 *   - uid 不同（同一张物理牌不能与自身配对）
 */
function isPair(a,b){
  if(!a||!b||a.uid===b.uid) return false;
  if(a.joker&&b.joker) return a.jokerType===b.jokerType;
  if(a.joker||b.joker) return false;
  return a.rank===b.rank&&a.suit===b.suit;
}

/**
 * 找出手牌中所有对子组合
 * @param {Array} hand - 手牌数组
 * @returns {Array}    [[card1,card2], ...] 对子数组
 * 注意：每张牌只会出现在一对中（贪心配对，先遇到的先配）
 */
function findPairs(hand){
  const r=[];
  for(let i=0;i<hand.length;i++)
    for(let j=i+1;j<hand.length;j++)
      if(isPair(hand[i],hand[j])) r.push([hand[i],hand[j]]);
  return r;
}

/**
 * 在手牌中找出所有恰好包含 `len` 对的连队（rank 连续的对子序列）
 *
 * 算法：
 *   1. 找出手牌中所有对子，按 rank 建立映射 byRank[rank]=pair
 *   2. 遍历所有连续窗口，检查是否有 len 个连续 rank
 *   3. 返回满足条件的所有连队，按最小 rank 降序（最强优先）
 *
 * @param {Array}  cards - 候选牌（通常是同花色的手牌子集）
 * @param {number} len   - 连队对数（≥2）
 * @param {string} sub   - 副主花色
 * @returns {Array}      [{play:[cards...], minRank}] 降序排列
 */
function findAllSeqs(cards,len,sub){
  const pairs=findPairs(cards);
  const byRank={};
  for(const p of pairs){
    const r=cardRank(p[0],sub);
    if(!byRank[r]) byRank[r]=p; // 同 rank 只保留第一对（避免重复）
  }
  const ranks=Object.keys(byRank).map(Number).sort((a,b)=>a-b);
  const res=[];
  for(let s=0;s<=ranks.length-len;s++){
    const run=ranks.slice(s,s+len);
    let ok=true;
    for(let i=1;i<run.length;i++) if(run[i]-run[i-1]!==1){ok=false;break;}
    if(ok){
      const play=[];
      for(const r of run) play.push(...byRank[r]);
      res.push({play,minRank:run[0]});
    }
  }
  return res.sort((a,b)=>b.minRank-a.minRank);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块五：牌型识别（getPlayType）
//
//  三种有效牌型：
//    single：单张，len=1
//    pair  ：对子，len=1（单对）或 len≥2（连队，rank连续）
//    fill  ：填牌，无有效形状，rank=-1，比较时永远输
//
//  返回对象：{ type, cat, rank, len }
//    type：牌型
//    cat ：花色类别（'main' 或 花色）
//    rank：用于比较大小（fill=-1，pair 取最低对 rank）
//    len ：对数（single=1，pair=1或n）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/**
 * 识别一组牌的牌型
 * @param {Array}  cards - 选中的牌
 * @param {string} sub   - 副主花色
 * @returns {Object|null}
 */
function getPlayType(cards,sub){
  if(!cards||!cards.length) return null;
  const n=cards.length;

  // 检查是否所有牌属于同一花色类别（多花色 → fill）
  const cats=[...new Set(cards.map(c=>cardCat(c,sub)))];
  if(cats.length>1) return{type:'fill',cat:'fill',rank:-1,len:0};
  const cat=cats[0];

  // 单张
  if(n===1) return{type:'single',cat,rank:cardRank(cards[0],sub),len:1};

  // 两张：只有成对才有效，否则 fill
  if(n===2){
    if(isPair(cards[0],cards[1])) return{type:'pair',cat,rank:cardRank(cards[0],sub),len:1};
    return{type:'fill',cat:'fill',rank:-1,len:0};
  }

  // 四张及以上（偶数）：尝试识别为连队
  if(n>=4&&n%2===0){
    // 按 rank 排序后贪心配对
    const sorted=[...cards].sort((a,b)=>cardRank(a,sub)-cardRank(b,sub));
    const used=new Set();
    const pairs=[];
    for(let i=0;i<sorted.length;i++){
      if(used.has(i)) continue;
      for(let j=i+1;j<sorted.length;j++){
        if(used.has(j)) continue;
        if(isPair(sorted[i],sorted[j])){
          pairs.push([sorted[i],sorted[j]]);
          used.add(i);used.add(j);
          break;
        }
      }
    }
    // 必须所有牌都能配对，且对子 rank 连续
    if(pairs.length===n/2){
      const ranks=pairs.map(p=>cardRank(p[0],sub)).sort((a,b)=>a-b);
      let consec=true;
      for(let i=1;i<ranks.length;i++) if(ranks[i]-ranks[i-1]!==1){consec=false;break;}
      if(consec&&pairs.length>=2) return{type:'pair',cat,rank:ranks[0],len:pairs.length};
    }
  }

  return{type:'fill',cat:'fill',rank:-1,len:0};
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块六：出牌比较（comparePlay）
//
//  二百四同步出牌制：四人各出一手牌，统一比较决出胜者。
//
//  比较优先级：
//    1. 牌型匹配：fill 永远输；类型+对数必须与首出一致
//    2. 花色类别：main(2) > roundCat(1) > 其他(0)
//    3. rank 值：数值大者胜
//    4. 出牌顺序：同 rank 时先出者胜（处理副10/副2同rank情况）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/**
 * 比较两手牌的大小
 * @param {Array}  cardsA   - A 的牌
 * @param {number} idxA     - A 的出牌顺序（0=最先）
 * @param {Array}  cardsB   - B 的牌
 * @param {number} idxB     - B 的出牺顺序
 * @param {string} roundCat - 本轮主导花色（首出者决定）
 * @param {Object} roundType- 本轮主导牌型 {type, len}
 * @param {string} sub      - 副主花色
 * @returns {number}        >0 表示 A 赢，<0 表示 B 赢
 */
function comparePlay(cardsA,idxA,cardsB,idxB,roundCat,roundType,sub){
  const ta=getPlayType(cardsA,sub);
  const tb=getPlayType(cardsB,sub);
  const rt=roundType;

  // 优先级1：牌型+对数必须与 roundType 完全一致（fill 永远不匹配）
  const aMatch=ta.type!=='fill'&&ta.type===rt.type&&ta.len===rt.len;
  const bMatch=tb.type!=='fill'&&tb.type===rt.type&&tb.len===rt.len;
  if(aMatch&&!bMatch) return 1;
  if(!aMatch&&bMatch) return -1;
  if(!aMatch&&!bMatch) return idxB-idxA; // 都是 fill：先出者赢

  // 优先级2：花色类别得分（main最高）
  const cScore=cat=>(cat==='main'?2:cat===roundCat?1:0);
  const ca=cScore(ta.cat),cb=cScore(tb.cat);
  if(ca!==cb) return ca-cb;

  // 优先级3：rank 数值
  if(ta.rank!==tb.rank) return ta.rank-tb.rank;

  // 优先级4：出牌顺序（先出为大，处理副10等同rank牌）
  return idxB-idxA;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块七：手牌排序
//
//  排序规则：
//    1. 花色类别优先：main > ♠ > ♥ > ♣ > ♦
//    2. 同类别内按 rank 降序（大的在左）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function sortHand(hand,sub){
  return[...hand].sort((a,b)=>{
    const ca=cardCat(a,sub),cb=cardCat(b,sub);
    const catOrd={main:0,'♠':1,'♥':2,'♣':3,'♦':4};
    const oa=catOrd[ca]??5,ob=catOrd[cb]??5;
    if(oa!==ob) return oa-ob;
    return cardRank(b,sub)-cardRank(a,sub);
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块八：填牌辅助
//
//  当无法满足跟牌要求时，按规则顺序选牌填充：
//    优先级：非分值牌（rank升序） > 5分牌 > K(10分) > 10(10分)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/**
 * 从候选牌池中按"弃子"优先级挑选 n 张填牌
 * @param {Array}  pool - 候选牌池
 * @param {number} n    - 需要的张数
 * @param {string} sub  - 副主花色（用于 rank 计算）
 * @returns {Array}     选出的 n 张牌
 */
function pickFillN(pool,n,sub){
  const ns=[...pool].filter(c=>cardScore(c)===0)
                    .sort((a,b)=>cardRank(a,sub)-cardRank(b,sub));  // 无分值牌，小的先出
  const sc=[...pool].filter(c=>cardScore(c)>0)
                    .sort((a,b)=>cardScore(a)-cardScore(b)||cardRank(a,sub)-cardRank(b,sub)); // 分值牌：5→K→10
  return[...ns,...sc].slice(0,n);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块九：AI 决策系统
//
//  AI 策略设计原则（简单贪心）：
//    喊牌：有10必喊，选副牌最多的花色
//    反牌：能反必反，选权值最高的
//    出牌：尽量出最大的牌（不考虑合作策略）
//
//  反牌权值顺序（从小到大）：
//    ♦ < ♣ < ♥ < ♠ < 小王 < 大王
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const REV_ORDER=['♦','♣','♥','♠','smalljoker','bigjoker'];

/** key 能否大过当前反牌 cur（cur=null 表示还没人反） */
function revBeats(k,cur){
  return REV_ORDER.indexOf(k)>(cur?REV_ORDER.indexOf(cur):-1);
}

/**
 * AI 选择喊牌花色
 * 策略：在手牌中的10对应花色里，选非主牌（非2非10）最多的那个花色
 * （副牌多意味着副主花色优势大）
 *
 * @param {Array} hand - AI 手牌
 * @returns {string|null} 喊的花色，null 表示不喊
 */
function aiPickShout(hand){
  const tens=hand.filter(c=>!c.joker&&c.rank==='10');
  if(!tens.length) return null;
  const cnt={};
  for(const c of hand)
    if(!c.joker&&c.rank!=='10'&&c.rank!=='2')
      cnt[c.suit]=(cnt[c.suit]||0)+1;
  const avail=[...new Set(tens.map(c=>c.suit))];
  let best=avail[0],bc=cnt[avail[0]]||0;
  for(const s of avail)
    if((cnt[s]||0)>bc){bc=cnt[s]||0;best=s;}
  return best;
}

/**
 * AI 选择最优反牌
 * 策略：从大王对到♦10对依次尝试，选第一个能大过当前 curBest 且手中有的
 *
 * @param {Array}       hand    - AI 手牌
 * @param {string|null} curBest - 当前最强反牌（null=还没人反）
 * @returns {string|null}       反牌 key，null 表示不反
 */
function aiPickReverse(hand,curBest){
  const checks=[
    {key:'bigjoker',   ok:h=>findPairs(h.filter(c=>c.joker&&c.jokerType==='big')).length>0},
    {key:'smalljoker', ok:h=>findPairs(h.filter(c=>c.joker&&c.jokerType==='small')).length>0},
    {key:'♠',ok:h=>findPairs(h.filter(c=>!c.joker&&c.rank==='10'&&c.suit==='♠')).length>0},
    {key:'♥',ok:h=>findPairs(h.filter(c=>!c.joker&&c.rank==='10'&&c.suit==='♥')).length>0},
    {key:'♣',ok:h=>findPairs(h.filter(c=>!c.joker&&c.rank==='10'&&c.suit==='♣')).length>0},
    {key:'♦',ok:h=>findPairs(h.filter(c=>!c.joker&&c.rank==='10'&&c.suit==='♦')).length>0},
  ];
  for(const ch of checks)
    if(revBeats(ch.key,curBest)&&ch.ok(hand)) return ch.key;
  return null;
}

/**
 * 从手牌中提取特定反牌对应的那对牌
 * @param {Array}  hand - 手牌
 * @param {string} key  - 反牌标识（'bigjoker'|'smalljoker'|'♠'|...）
 * @returns {Array|null} [card1,card2] 或 null
 */
function getRevPairCards(hand,key){
  if(key==='bigjoker')   return findPairs(hand.filter(c=>c.joker&&c.jokerType==='big'))[0]||null;
  if(key==='smalljoker') return findPairs(hand.filter(c=>c.joker&&c.jokerType==='small'))[0]||null;
  return findPairs(hand.filter(c=>!c.joker&&c.rank==='10'&&c.suit===key))[0]||null;
}

/**
 * AI 出牌入口
 * @param {Array}   hand      - AI 手牌
 * @param {string}  roundCat  - 本轮主导花色（首出者决定）
 * @param {Object}  roundType - 本轮牌型 {type, len}
 * @param {string}  sub       - 副主花色
 * @param {boolean} isLeader  - 是否首出
 */
function aiChoosePlay(hand,roundCat,roundType,sub,isLeader){
  const n=roundType?roundType.len*(roundType.type==='single'?1:2):1;
  if(isLeader) return aiLead(hand,sub);
  return aiFollow(hand,roundCat,roundType,sub,n);
}

/**
 * AI 首出策略：优先出最大的对子，无对子则出最大单张
 */
function aiLead(hand,sub){
  const pairs=findPairs(hand).sort((a,b)=>cardRank(b[0],sub)-cardRank(a[0],sub));
  if(pairs.length) return pairs[0];
  return[sortHand(hand,sub)[0]];
}

/**
 * AI 跟牌策略
 * 优先级：
 *   1. 有同花色牌 → 尽量出同花色中最大的
 *      - single：出同花色最大单张
 *      - pair len=1：出同花色最大对子（无对则填充）
 *      - pair len>=2：出同花色连队（无连队则尽量多填同花色）
 *   2. 无同花色 → 尝试用主牌（main）踩（出最大的主牌对/连队）
 *   3. 无主牌  → 用 pickFillN 凑够数量（损失最小原则）
 */
function aiFollow(hand,roundCat,roundType,sub,n){
  const same=hand.filter(c=>cardCat(c,sub)===roundCat);
  const main=hand.filter(c=>cardCat(c,sub)==='main');

  if(same.length>0){
    if(roundType.type==='single'){
      return[[...same].sort((a,b)=>cardRank(b,sub)-cardRank(a,sub))[0]];
    }
    if(roundType.type==='pair'&&roundType.len===1){
      const sp=findPairs(same).sort((a,b)=>cardRank(b[0],sub)-cardRank(a[0],sub));
      if(sp.length) return sp[0];
      return pickFillN(same,2,sub); // 无对子：填2张同花色（损失最小）
    }
    if(roundType.type==='pair'&&roundType.len>=2){
      const ss=findAllSeqs(same,roundType.len,sub);
      if(ss.length) return ss[0].play;
      // 凑不出连队：先用同花色填，再用其他牌补
      const fromSame=pickFillN(same,Math.min(same.length,n),sub);
      if(fromSame.length>=n) return fromSame;
      const rest=hand.filter(c=>cardCat(c,sub)!==roundCat);
      return[...fromSame,...pickFillN(rest,n-fromSame.length,sub)];
    }
  }

  // 无同花色：尝试主牌踩
  if(roundType.type==='single'){
    if(main.length) return[[...main].sort((a,b)=>cardRank(b,sub)-cardRank(a,sub))[0]];
    return pickFillN(hand,1,sub);
  }
  if(roundType.type==='pair'){
    if(roundType.len>=2){
      const ms=findAllSeqs(main,roundType.len,sub);
      if(ms.length) return ms[0].play;
    } else {
      const mp=findPairs(main).sort((a,b)=>cardRank(b[0],sub)-cardRank(a[0],sub));
      if(mp.length) return mp[0];
    }
    return pickFillN(hand,n,sub);
  }
  return pickFillN(hand,n,sub);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块十：出牌合法性验证（validatePlay）
//
//  只针对人类玩家的跟牌进行验证（AI 出牌由逻辑保证合法）。
//  首出玩家：几乎自由出牌（仅需满足"首出必须含反牌对子"约束）
//  跟牌玩家：三步验证逻辑
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/**
 * 验证玩家出牌是否合法
 * @param {Array}  cards - 玩家选中的牌
 * @param {Object} G     - 游戏状态对象
 * @returns {string|null} 错误信息（null 表示合法）
 */
function validatePlay(cards,G){
  if(!cards||!cards.length) return '请先选牌';
  const t=getPlayType(cards,G.sub);
  if(!t) return '无效牌型';

  // ── 首出玩家：自由出牌（只需含反牌对子）──
  if(G.isLeader){
    if(G.mustLeadPair){
      const pair=getRevPairCards(G.hands[0],G.mustLeadPair);
      if(pair&&!pair.every(c=>cards.find(x=>x.uid===c.uid)))
        return '首出必须包含反牌对子';
    }
    return null;
  }

  // ── 跟牌玩家 ──
  const n=G.roundType.len*(G.roundType.type==='single'?1:2);
  if(cards.length!==n) return `必须出${n}张`;

  const hand=G.hands[0];
  const rt=G.roundType;

  // 第一步：检查选中的牌是否全部属于 roundCat 花色
  const allSameSuit=cards.every(c=>cardCat(c,G.sub)===G.roundCat);

  if(!allSameSuit){
    // 第二步：若非全同花色，检查手中是否还有 roundCat 花色的牌
    // 如果有，说明玩家应该先出同花色的，当前出法违规
    const remainingHand=hand.filter(c=>!cards.find(x=>x.uid===c.uid));
    if(remainingHand.some(c=>cardCat(c,G.sub)===G.roundCat))
      return '有同花色牌，必须出同花色牌';

    // 手中没有同花色了（已全部包含在 cards 中或手中本就没有）
    // 此时属于"填牌"情况，只需检查不能主动出分值牌
    const notSuit=hand.filter(c=>cardCat(c,G.sub)!==G.roundCat);
    const hasNonScore=notSuit.some(c=>cardScore(c)===0);
    const fillCards=cards.filter(c=>cardCat(c,G.sub)!==G.roundCat);
    if(fillCards.length>0&&hasNonScore&&fillCards.some(c=>cardScore(c)>0))
      return '有非分值牌，填牌不能出分值牌';
    return null;
  }

  // 所有选中牌均属 roundCat 花色，检查牌型约束
  if(rt.type==='single') return null; // single：同花色任意单张均合法

  if(rt.type==='pair'){
    // 第三步：强制对子/连队约束
    const sameSuitInHand=hand.filter(c=>cardCat(c,G.sub)===G.roundCat);
    const allPairsInHand=findPairs(sameSuitInHand);

    if(allPairsInHand.length===0) return null; // 无对子，填牌合法

    const pairsNeeded=rt.len; // 需要几对（单对=1，连队=N）

    if(allPairsInHand.length<=pairsNeeded){
      // 可用对子不够：必须把所有对子全出（不能漏掉任何一对）
      const missingPair=allPairsInHand.some(p=>!p.every(c=>cards.find(x=>x.uid===c.uid)));
      if(missingPair) return '同花色对子不足，需将所有同花色对子全部出完';
    } else {
      // 可用对子足够：选中的牌必须恰好构成 pairsNeeded 对
      if(t.type!=='pair'||t.len!==pairsNeeded)
        return `有${allPairsInHand.length}对同花色牌，必须出其中${pairsNeeded}对`;
    }

    // 连队额外约束：len>=2 时必须 rank 连续（getPlayType 已处理，这里只做兜底）
    if(pairsNeeded>=2&&t.type==='pair'&&t.len!==pairsNeeded)
      return `需出${pairsNeeded}连对`;
    if(pairsNeeded>=2&&t.type!=='pair') return `需出${pairsNeeded}连对`;
  }

  // 分值牌约束：有非分值同花色牌时，不能主动出分值牌（除非能打赢）
  const sameSuitCards=hand.filter(c=>cardCat(c,G.sub)===G.roundCat);
  const nsame=sameSuitCards.filter(c=>cardScore(c)===0);
  if(nsame.length&&cards.some(c=>cardScore(c)>0)){
    const myCS=(t.cat==='main'?2:t.cat===G.roundCat?1:0);
    const beatsBest=t.type===rt.type&&t.len===rt.len&&
      (myCS>G.roundBestCatScore||(myCS===G.roundBestCatScore&&t.rank>G.roundBestRank));
    if(!beatsBest) return '有非分值同花色牌，不能主动填分';
  }

  return null;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块十一：游戏状态管理
//
//  全局状态 G 包含当前局所有运行时数据。
//  使用 Object.assign 重置（保留 highScore 跨局信息）。
//
//  游戏状态机（G.phase）：
//    'deal'      → 发牌阶段
//    'countdown' → 无人喊牌，5秒倒计时
//    'reverse'   → 反牌阶段
//    'play'      → 出牌阶段
//    'end'       → 本局结束
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

let G={highScore:0};       // 游戏状态（跨局保留 highScore）
let cumScores=[0,0,0,0];  // 各座位的累计得分差（本局得分-60的总和）
let roundNum=0;            // 当前局数

// UI 交互状态
let sel=[];      // 当前人类玩家选中牌的 uid 数组
let hintList=[]; // 提示候选牌型列表
let hintIdx=0;   // 当前提示索引

// 定时器引用（便于清除）
let dealTmr=null; // 发牌定时器
let cdTmr=null;   // 倒计时定时器

/** 玩家名称数组（按座位顺序） */
const PNAME=['你','AI一','AI二','AI三'];
function pname(i){return PNAME[i]||`座${i}`;}

/** 从大厅进入游戏 */
function startGame(){
  document.getElementById('lobby').classList.add('hide');
  document.getElementById('game').classList.remove('hide');
  G={highScore:0};cumScores=[0,0,0,0];roundNum=0;
  newRound();
}

/**
 * 开始新一局
 * 重置所有游戏状态、清空 UI，然后开始发牌
 */
function newRound(){
  clearTimeout(dealTmr);clearTimeout(cdTmr);
  roundNum++;
  const deck=shuffle(makeDeck());

  // 用 Object.assign 保留 highScore，覆盖其他字段
  G=Object.assign(G,{
    phase:'deal',
    deck,
    hands:[[],[],[],[]],    // 四个座位的手牌
    sub:null,               // 副主花色（null=打正主）
    shouter:-1,             // 喊牌者座位（-1=无人喊）
    revBest:null,           // 当前最强反牌 key
    revWinner:-1,           // 反牌获胜者座位
    revPhaseStep:0,         // 反牌阶段步骤：0=轮询其他3人，1=喊牌者回应
    revOtherArr:[],         // 非喊牌者的3个座位（按顺序）
    revOtherIdx:0,          // 当前轮到 revOtherArr 的哪个人
    mustLeadPair:null,      // 若有反牌，首出必须包含此对子
    firstSeat:G.highScore||0, // 首出座位（上局得分最高者，首局为0）
    // 出牌阶段
    leader:-1,              // 当前子轮首出者座位
    turnOrder:[],           // 本子轮出牌顺序（4个座位）
    turnIdx:0,              // 当前轮到 turnOrder[turnIdx]
    roundCat:null,          // 本子轮主导花色（首出者决定）
    roundType:null,         // 本子轮主导牌型 {type, len, rank, cat}
    roundBestRank:-1,       // 本子轮迄今最强 rank（用于合法性检查）
    roundBestCatScore:-1,   // 本子轮迄今最强花色分（用于合法性检查）
    isLeader:false,         // 当前是否轮到人类玩家首出
    subPlays:null,          // {seat: {cards, orderIdx}} 本子轮各人出牌记录
    subPlayCount:0,         // 出牌计数（用于生成 orderIdx）
    scores:[0,0,0,0],       // 本局各座位得分
  });

  sel=[];hintList=[];hintIdx=0;

  // 重置 UI
  document.getElementById('hand-top').innerHTML='';
  document.getElementById('hand-left').innerHTML='';
  document.getElementById('hand-right').innerHTML='';
  document.getElementById('hand-bottom').innerHTML='';
  document.getElementById('round-plays').innerHTML='';
  document.getElementById('action-bar').classList.add('hide');
  document.getElementById('rev-panel').classList.add('hide');
  document.getElementById('shout-panel').classList.add('hide');
  document.getElementById('countdown-bar').classList.add('hide');
  document.getElementById('c-rnd').textContent=roundNum;
  setSubDisplay(null);
  for(let i=0;i<4;i++){
    document.getElementById(`ps-${i}`).textContent='0分';
    document.getElementById(`pr-${i}`).classList.add('hide');
    document.getElementById(`td-${i}`).classList.add('hide');
    document.getElementById(`pt-${i}`).classList.remove('active');
  }
  updateHcnts();
  setStatus('发牌中...');

  // 启动逐张发牌
  G.dealIdx=0;
  G.dealSeat=G.firstSeat; // 从上局得分最高者开始发（逆时针，即 +1 方向）
  doDeals();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块十二：发牌阶段
//
//  一次发一张，间隔 90ms，逆时针轮转（seat+1）%4。
//  发牌过程中不暂停：
//    - AI 拿到10时，若决定喊牌，短延迟后喊（~300-900ms）
//    - 人类拿到10时，实时更新喊牌面板（不中断发牌）
//  发完84张后，进入 onDealDone() 处理后续阶段。
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function doDeals(){
  if(G.dealIdx>=84){onDealDone();return;}
  const seat=G.dealSeat;
  const card=G.deck[G.dealIdx++];
  G.dealSeat=(G.dealSeat+1)%4;
  G.hands[seat].push(card);
  addCardToHand(seat,card);
  SFX.deal();

  // AI 喊牌检查：只在还无人喊牌时，AI拿到10才判断
  if(G.shouter<0&&seat!==0&&!card.joker&&card.rank==='10'){
    const wantSuit=aiPickShout(G.hands[seat]);
    if(wantSuit===card.suit){
      // AI 决定喊：短延迟后执行（模拟思考时间），然后继续发牌
      const s=seat,su=wantSuit;
      dealTmr=setTimeout(()=>{
        if(G.shouter<0) applyShout(s,su,'AI');
        dealTmr=setTimeout(doDeals,90);
      },300+Math.random()*600);
      return; // 暂停发牌，等喊牌完成
    }
  }

  // 人类拿到10：更新喊牌面板（面板已存在则追加新花色按钮）
  if(seat===0&&!card.joker&&card.rank==='10'){
    refreshShoutPanel();
  }

  dealTmr=setTimeout(doDeals,90); // 继续下一张
}

/**
 * 应用喊牌（AI 或 人类）
 * - 设置 G.shouter 和 G.sub
 * - 显示副主花色、Toast、角色标签
 * - 隐藏喊牌面板
 */
function applyShout(seat,suit,src){
  G.shouter=seat;G.sub=suit;
  setSubDisplay(suit);
  const who=src==='AI'?pname(seat):'你';
  toast(`${who} 喊了 ${suit} 副主！`,2200,'tgold');
  SFX.shout();
  showRolePill(seat,'喊牌','rp-shout');
  document.getElementById('shout-panel').classList.add('hide');
}

/**
 * 刷新喊牌面板（发牌过程中动态更新）
 * - 若已有人喊牌：隐藏面板
 * - 否则：根据手中10的花色动态生成喊牌按钮
 */
function refreshShoutPanel(){
  if(G.shouter>=0){document.getElementById('shout-panel').classList.add('hide');return;}
  const myTens=G.hands[0].filter(c=>!c.joker&&c.rank==='10');
  if(!myTens.length) return;
  const btns=document.getElementById('shout-btns');
  const suits=[...new Set(myTens.map(c=>c.suit))]; // 去重，只显示有的花色
  btns.innerHTML='';
  const suitName={'♠':'黑桃','♥':'红桃','♣':'梅花','♦':'方块'};
  for(const s of suits){
    const b=document.createElement('button');
    b.className='btn btn-ghost';b.style.fontSize='12px';
    b.textContent=s+' '+suitName[s];
    b.onclick=()=>humanShout(s);
    btns.appendChild(b);
  }
  document.getElementById('shout-panel').classList.remove('hide');
}

/**
 * 人类点击喊牌按钮
 * - 发牌阶段：记录喊牌，面板隐藏，发牌继续（onDealDone 后进入反牌）
 * - 倒计时阶段（countdown）：取消倒计时，立即进入反牌
 */
function humanShout(suit){
  if(G.shouter>=0) return; // 已有人喊，忽略
  clearTimeout(cdTmr);
  document.getElementById('countdown-bar').classList.add('hide');
  applyShout(0,suit,'human');
  if(G.phase==='countdown'){
    // 发牌已结束，正在等待，现在进入反牌
    G.phase='reverse';
    for(let i=0;i<4;i++) G.hands[i]=sortHand(G.hands[i],G.sub);
    renderAllHands();
    G.revWinner=0;
    G.revOtherArr=[(G.shouter+1)%4,(G.shouter+2)%4,(G.shouter+3)%4];
    G.revOtherIdx=0;G.revPhaseStep=0;
    setTimeout(processRevOther,700);
  }
  // 若在发牌阶段：仅记录喊牌，发牌继续，onDealDone 后会调用 enterReverse
}

/**
 * 发牌结束处理
 * - 整理并渲染所有手牌
 * - 若有人喊牌：进入反牌阶段
 * - 否则：启动5秒倒计时（无人喊则打正主）
 */
function onDealDone(){
  document.getElementById('shout-panel').classList.add('hide');
  for(let i=0;i<4;i++) G.hands[i]=sortHand(G.hands[i],G.sub);
  renderAllHands();
  if(G.shouter>=0) enterReverse();
  else startNoShoutCountdown();
}

/**
 * 无人喊牌后的5秒倒计时
 * - 仍然显示喊牌面板（玩家还可以喊）
 * - 若5秒内无人喊：startPlay()（打正主）
 * - 若玩家在倒计时内喊牌：humanShout() 取消倒计时，进入反牌
 */
function startNoShoutCountdown(){
  G.phase='countdown';
  let t=5;
  const fs=G.firstSeat;
  refreshShoutPanel(); // 倒计时期间依然可以喊牌
  const tick=()=>{
    if(G.shouter>=0) return; // 有人喊了，停止倒计时
    const bar=document.getElementById('countdown-bar');
    bar.classList.remove('hide');
    if(t<=0){
      bar.classList.add('hide');
      document.getElementById('shout-panel').classList.add('hide');
      toast('打正主！',1800,'tgold');
      startPlay();
      return;
    }
    bar.textContent=`无人喊牌 → 打正主，${pname(fs)} 首出 · ${t}s`;
    setStatus(`无人喊牌——打正主，<b>${pname(fs)}</b> 首出`);
    t--;
    cdTmr=setTimeout(tick,1000);
  };
  tick();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块十三：反牌阶段
//
//  喊牌后，其他3名玩家（逆时针顺序）依次有机会反牌：
//    - 反牌可改变副主花色（副10对）或打为正主（王牌对）
//    - 后反的必须大过前反的（按 REV_ORDER 排序）
//    - 打出王牌对（大/小王）后立即结束，无法再反
//    - 3人都过后，原喊牌者可以响应（若有人已反）
//
//  反牌流程：
//    enterReverse → processRevOther（轮询其他3人）
//      → (human) showRevPanel → humanRev
//      → (AI)    aiRevStep
//    → (全过后) 喊牌者回应（revPhaseStep=1）
//    → finishReverse → startPlay
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/** 进入反牌阶段（由 onDealDone 或 humanShout 调用） */
function enterReverse(){
  G.phase='reverse';
  G.revWinner=G.shouter;   // 初始"反牌获胜者"为喊牌者自己
  G.revOtherArr=[(G.shouter+1)%4,(G.shouter+2)%4,(G.shouter+3)%4]; // 逆时针其他3人
  G.revOtherIdx=0;G.revPhaseStep=0;
  setStatus(`进入反牌阶段，<b>${pname(G.shouter)}</b> 喊牌`);
  setTimeout(processRevOther,800);
}

/**
 * 处理反牌阶段轮次：轮流让其他3人决定是否反牌
 * 轮完后（revOtherIdx>=3），进入喊牌者回应阶段（revPhaseStep=1）
 */
function processRevOther(){
  if(G.revOtherIdx>=3){
    G.revPhaseStep=1;
    // 只有当有人已反过时，喊牌者才有机会回应
    if(G.revBest!==null){
      const seat=G.shouter;
      if(seat===0) showRevPanel(); else aiRevStep(seat,true);
    } else {
      finishReverse(); // 全部过：直接进入出牌
    }
    return;
  }
  const seat=G.revOtherArr[G.revOtherIdx];
  if(seat===0) showRevPanel(); else aiRevStep(seat,false);
}

/**
 * AI 反牌步骤
 * @param {number}  seat      - AI 座位
 * @param {boolean} isShouter - 是否是喊牌者（喊牌者是最后响应的）
 */
function aiRevStep(seat,isShouter){
  setStatus(`${pname(seat)} 考虑反牌...`);
  setTimeout(()=>{
    const key=aiPickReverse(G.hands[seat],G.revBest);
    if(key&&revBeats(key,G.revBest)){
      doApplyReverse(seat,key);
      // 王牌反牌立即结束（无法再大过）
      if(key==='bigjoker'||key==='smalljoker'){finishReverse();return;}
    }
    if(isShouter) finishReverse();
    else{G.revOtherIdx++;processRevOther();}
  },500+Math.random()*500);
}

/**
 * 应用反牌结果（更新 sub、revWinner，重新排序手牌）
 * @param {number} seat - 反牌者座位
 * @param {string} key  - 反牌标识
 */
function doApplyReverse(seat,key){
  G.revBest=key;G.revWinner=seat;
  const isZ=key==='bigjoker'||key==='smalljoker';
  if(isZ){G.sub=null;setSubDisplay(null);}      // 王牌反牌：打正主
  else{G.sub=key;setSubDisplay(key);}            // 10对反牌：换副主花色
  for(let i=0;i<4;i++) G.hands[i]=sortHand(G.hands[i],G.sub);
  renderAllHands();
  toast(isZ?`${pname(seat)} 打正主！`:`${pname(seat)} 反了${key}10！`,1800,'tgold');
  SFX.shout();
  showRolePill(seat,'反牌','rp-rev');
}

/**
 * 显示人类反牌面板
 * 根据当前 revBest 动态 disabled 无法使用的选项
 */
function showRevPanel(){
  const h=G.hands[0];
  const rb=(id,cond)=>{document.getElementById(id).disabled=!cond;};
  rb('rb-bj',revBeats('bigjoker',G.revBest)&&findPairs(h.filter(c=>c.joker&&c.jokerType==='big')).length);
  rb('rb-sj',revBeats('smalljoker',G.revBest)&&findPairs(h.filter(c=>c.joker&&c.jokerType==='small')).length);
  rb('rb-sp',revBeats('♠',G.revBest)&&findPairs(h.filter(c=>!c.joker&&c.rank==='10'&&c.suit==='♠')).length);
  rb('rb-hp',revBeats('♥',G.revBest)&&findPairs(h.filter(c=>!c.joker&&c.rank==='10'&&c.suit==='♥')).length);
  rb('rb-cp',revBeats('♣',G.revBest)&&findPairs(h.filter(c=>!c.joker&&c.rank==='10'&&c.suit==='♣')).length);
  rb('rb-dp',revBeats('♦',G.revBest)&&findPairs(h.filter(c=>!c.joker&&c.rank==='10'&&c.suit==='♦')).length);
  document.getElementById('rev-panel').classList.remove('hide');
  setStatus('你是否反牌？');
}

/**
 * 人类反牌处理
 * @param {string|null} key - 反牌选择（null=过）
 */
function humanRev(key){
  document.getElementById('rev-panel').classList.add('hide');
  if(key&&revBeats(key,G.revBest)){
    doApplyReverse(0,key);
    if(key==='bigjoker'||key==='smalljoker'){finishReverse();return;}
  }
  // 推进反牌流程
  if(G.revPhaseStep===1) finishReverse(); // 喊牌者回应完毕
  else{G.revOtherIdx++;processRevOther();} // 继续下一个人
}

/**
 * 反牌阶段结束，进入出牌阶段
 * - 记录 mustLeadPair（若有人反牌）
 * - 由反牌获胜者（或喊牌者）首出
 */
function finishReverse(){
  document.getElementById('rev-panel').classList.add('hide');
  for(let i=0;i<4;i++) G.hands[i]=sortHand(G.hands[i],G.sub);
  renderAllHands();
  if(G.revBest) G.mustLeadPair=G.revBest; // 首出必须含反牌对子
  const sub=G.sub;
  setStatus(sub?`副主：${sub} · <b>${pname(G.revWinner)}</b> 首出`:`打正主 · <b>${pname(G.revWinner)}</b> 首出`);
  setTimeout(startPlay,600);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块十四：出牌阶段（同步出牌制）
//
//  规则：每个子轮，所有玩家各出一手牌（不允许过），
//  四人出完后统一比较大小，得分归胜者，胜者首出下一轮。
//
//  子轮流程：
//    beginSubRound → scheduleTurn（逐人）
//      → (human) humanPlayTurn → doPlay → commitPlay
//      → (AI)    aiPlayTurn → commitPlay
//    → resolveSubRound（比较 + 计分 + 胜者领下轮）
//
//  终止条件：任意玩家手牌为空 → endRound()
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function startPlay(){
  G.phase='play';
  // 首出者：有人反牌则为反牌获胜者，否则为喊牌者，否则为 firstSeat
  G.leader=G.revWinner>=0?G.revWinner:G.firstSeat;
  beginSubRound();
}

/**
 * 开始一个新的子轮
 * - 确定本轮出牌顺序（以 leader 为起点，顺序 seat+1）
 * - 重置所有子轮状态
 */
function beginSubRound(){
  G.turnOrder=[];
  for(let i=0;i<4;i++) G.turnOrder.push((G.leader+i)%4);
  G.turnIdx=0;
  G.roundCat=null;G.roundType=null;
  G.roundBestRank=-1;G.roundBestCatScore=-1;
  G.subPlays={};G.subPlayCount=0;
  G.isLeader=true;
  document.getElementById('round-plays').innerHTML=''; // 清空出牌展示区
  setActiveDot(G.turnOrder[0]);
  setStatus(`<b>${pname(G.leader)}</b> 首出`);
  scheduleTurn();
}

/**
 * 调度下一个出牌者
 * - 若四人均已出牌（turnIdx>=4）→ resolveSubRound
 * - 否则：让当前玩家出牌（human 或 AI）
 */
function scheduleTurn(){
  if(G.turnIdx>=4){resolveSubRound();return;}
  const seat=G.turnOrder[G.turnIdx];
  const isLeader=(G.turnIdx===0); // 是否为本轮首出
  G.isLeader=isLeader&&(seat===0);
  setActiveDot(seat);
  if(seat===0){
    humanPlayTurn(isLeader);
  } else {
    setStatus(`${pname(seat)} 出牌中...`);
    setTimeout(()=>aiPlayTurn(seat,isLeader),600+Math.random()*500);
  }
}

/** 人类出牌回合：显示操作栏，等待玩家选牌并点击"出牌" */
function humanPlayTurn(isLeader){
  sel=[];hintList=[];hintIdx=0;
  document.getElementById('action-bar').classList.remove('hide');
  setStatus(isLeader?'轮到你首出':'跟牌（必须出牌）');
  renderMyHand();
}

/**
 * AI 出牌回合
 * @param {number}  seat     - AI 座位
 * @param {boolean} isLeader - 是否首出
 */
function aiPlayTurn(seat,isLeader){
  document.getElementById('action-bar').classList.add('hide');

  // 首出且有 mustLeadPair 约束：必须先出反牌对子
  if(G.mustLeadPair&&isLeader){
    const pair=getRevPairCards(G.hands[seat],G.mustLeadPair);
    if(pair){G.mustLeadPair=null;commitPlay(seat,pair,isLeader);return;}
    G.mustLeadPair=null; // AI 手中没有该对子（可能已在前面出了），跳过
  }

  const play=aiChoosePlay(G.hands[seat],G.roundCat,G.roundType,G.sub,isLeader);
  const n=G.roundType?G.roundType.len*(G.roundType.type==='single'?1:2):null;

  let final=play||[];
  // 保险：确保跟牌数量正确
  if(!isLeader&&n&&final.length!==n){
    final=pickFillN(G.hands[seat],n,G.sub);
  }
  if(!final.length) final=[G.hands[seat][0]]; // 极端情况兜底
  commitPlay(seat,final,isLeader);
}

/** 人类点击"出牌"按钮 */
function doPlay(){
  if(!sel.length){toast('请先选牌','tred');return;}
  const cards=sel.map(uid=>G.hands[0].find(c=>c.uid===uid)).filter(Boolean);

  // 反牌对子约束检查
  if(G.isLeader&&G.mustLeadPair){
    const pair=getRevPairCards(G.hands[0],G.mustLeadPair);
    if(pair&&!pair.every(c=>cards.find(x=>x.uid===c.uid))){
      toast('首出必须包含反牌对子','tred');shakeHand();return;
    }
  }

  const err=validatePlay(cards,G);
  if(err){toast(err,'tred');shakeHand();return;}

  if(G.isLeader&&G.mustLeadPair) G.mustLeadPair=null;

  const errCommit=commitPlay(0,cards,G.turnIdx===0);
  if(errCommit){toast(errCommit,'tred');shakeHand();return;}
  document.getElementById('action-bar').classList.add('hide');
}

/**
 * 提交出牌（记录、移牌、渲染、推进轮次）
 * @param {number}  seat     - 出牌座位
 * @param {Array}   cards    - 出的牌
 * @param {boolean} isLeader - 是否首出
 * @returns {string|null}    错误信息（用于人类出牌校验）
 */
function commitPlay(seat,cards,isLeader){
  SFX.play();
  const catScore=cat=>(cat==='main'?2:cat===G.roundCat?1:0);

  if(isLeader){
    // 首出者确定本轮主导花色和牌型
    G.roundCat=cardCat(cards[0],G.sub);
    const pt=getPlayType(cards,G.sub);
    if(pt.type==='fill') return '出牌无效'; // 首出不允许 fill
    G.roundType=pt;
    G.roundBestRank=pt.rank;
    G.roundBestCatScore=catScore(pt.cat);
  } else {
    // 跟牌者：更新本轮最强牌记录（供后续跟牌者验证）
    const pt=getPlayType(cards,G.sub);
    if(pt.type!=='fill'&&pt.type===G.roundType.type&&pt.len===G.roundType.len){
      const myCS=catScore(pt.cat);
      if(myCS>G.roundBestCatScore||(myCS===G.roundBestCatScore&&pt.rank>G.roundBestRank)){
        G.roundBestRank=pt.rank;
        G.roundBestCatScore=myCS;
      }
    }
  }

  // 记录本轮出牌（用于 resolveSubRound 比较）
  const orderIdx=G.subPlayCount++;
  G.subPlays[seat]={cards,orderIdx};

  // 从手牌中移除已出的牌
  const uidSet=new Set(cards.map(c=>c.uid));
  G.hands[seat]=G.hands[seat].filter(c=>!uidSet.has(c.uid));
  updateHandDisplay(seat);
  showSubPlay(seat,cards);   // 在中央展示区显示这手牌

  G.turnIdx++;
  setTimeout(scheduleTurn,280); // 短延迟后处理下一人
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块十五：子轮结算
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/**
 * 四人均已出牌后，比较大小、计分、决定下一轮首出者
 */
function resolveSubRound(){
  // 以第一个出牌者为初始最强，逐一比较
  const seats=Object.keys(G.subPlays).map(Number);
  let winnerSeat=seats[0];
  for(let i=1;i<seats.length;i++){
    const s=seats[i];
    const cmp=comparePlay(
      G.subPlays[s].cards,       G.subPlays[s].orderIdx,
      G.subPlays[winnerSeat].cards, G.subPlays[winnerSeat].orderIdx,
      G.roundCat, G.roundType, G.sub
    );
    if(cmp>0) winnerSeat=s;
  }

  // 统计本轮所有牌的分值，归胜者
  let gained=0;
  for(const seat of seats) gained+=totalScore(G.subPlays[seat].cards);
  if(gained>0){G.scores[winnerSeat]+=gained;SFX.score();}
  updateScoreUI();
  highlightSubWinner(winnerSeat);

  const scoreMsg=gained>0?` +${gained}分`:'';
  toast(`${pname(winnerSeat)} 赢得本轮${scoreMsg}`,1600,gained>0?'tgold':'');

  setTimeout(()=>{
    // 若任意玩家手牌已空：本局结束
    const anyEmpty=G.hands.some(h=>h.length===0);
    if(anyEmpty){endRound();return;}
    // 否则：胜者首出下一子轮
    G.leader=winnerSeat;
    beginSubRound();
  },1400); // 1.4秒后清场，让玩家看到结果
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块十六：提示系统
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/** 循环显示下一个提示（每次点击切换到下一个合法出牌组合） */
function doHint(){
  if(!hintList.length||hintIdx>=hintList.length){
    hintList=buildHints();hintIdx=0;
    if(!hintList.length){toast('无提示','tred');return;}
  }
  sel=hintList[hintIdx].map(c=>c.uid);
  hintIdx=(hintIdx+1)%hintList.length;
  SFX.pick();renderMyHand();
}

/**
 * 构建提示列表
 * - 首出：列出所有可能的单张、对子、连队
 * - 跟牌：列出同花色中所有满足牌型约束的出法（无则给出填牌建议）
 */
function buildHints(){
  const hand=G.hands[0];
  if(G.isLeader||!G.roundType){
    const r=[];
    for(const c of hand) r.push([c]);
    for(const p of findPairs(hand)) r.push(p);
    for(let len=2;len<=10;len++)
      for(const s of findAllSeqs(hand,len,G.sub)) r.push(s.play);
    return r;
  }
  const n=G.roundType.len*(G.roundType.type==='single'?1:2);
  const same=hand.filter(c=>cardCat(c,G.sub)===G.roundCat);
  const res=[];
  if(G.roundType.type==='single'){
    for(const c of same.length?same:hand) res.push([c]);
  } else if(G.roundType.type==='pair'){
    const pool=same.length?same:hand;
    if(G.roundType.len===1){
      for(const p of findPairs(pool)) res.push(p);
    } else {
      for(const s of findAllSeqs(pool,G.roundType.len,G.sub)) res.push(s.play);
    }
    if(!res.length) res.push(pickFillN(pool.length?pool:hand,n,G.sub));
  }
  if(!res.length) res.push(pickFillN(hand,n,G.sub));
  return res;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块十七：局结算
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/**
 * 本局结束：计算得分差值，决定下一局首出者，显示结算界面
 * 基准分：60（总分240/4人）
 * 得分最高者成为下一局首出者
 */
function endRound(){
  G.phase='end';
  let high=G.scores[0],highSeat=0;
  for(let i=1;i<4;i++) if(G.scores[i]>high){high=G.scores[i];highSeat=i;}
  G.highScore=highSeat;          // 保存到 G，newRound 时读取
  const deltas=G.scores.map(s=>s-60); // 与基准的差值
  for(let i=0;i<4;i++) cumScores[i]+=deltas[i]; // 累积跨局
  showEndScreen(deltas);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块十八：渲染系统
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const ccls={red:'cred',black:'cblk'};
/** 根据花色判断牌面颜色（红/黑） */
function cardColor(c){return(c.joker||c.suit==='♥'||c.suit==='♦')?'red':'black';}

/**
 * 创建一张牌的 DOM 元素
 * @param {Object}  c      - 牌对象
 * @param {boolean} faceUp - 是否正面朝上
 * @returns {HTMLElement}
 */
function mkCard(c,faceUp){
  const el=document.createElement('div');
  el.className='card'+(faceUp?'':' back');
  if(!faceUp) return el; // 背面：纯样式，无内容
  const cl=ccls[cardColor(c)];
  if(c.joker){
    // 王牌：左上角显示"大/小王"，中央显示 Emoji
    el.innerHTML=`<div class="cc ${cl}"><span class="cr">${c.rank}</span><span class="jtag">王</span></div><div class="cct">${c.suit}</div><div class="cc ccb ${cl}"><span class="cr">${c.rank}</span></div>`;
  } else {
    // 普通牌：左上+右下显示点数花色，中央大花色
    el.innerHTML=`<div class="cc ${cl}"><span class="cr">${c.rank}</span><span class="cs">${c.suit}</span></div><div class="cct ${cl}">${c.suit}</div><div class="cc ccb ${cl}"><span class="cr">${c.rank}</span><span class="cs">${c.suit}</span></div>`;
  }
  return el;
}

/**
 * 发牌时将一张牌动画添加到对应座位的手牌区
 * 座位→手牌容器映射：0→bottom, 1→right, 2→top, 3→left
 */
function addCardToHand(seat,card){
  const ids=['hand-bottom','hand-right','hand-top','hand-left'];
  const cont=document.getElementById(ids[seat]);
  if(!cont) return;
  const el=mkCard(card,seat===0); // 只有人类（座位0）才显示正面
  el.classList.add('dealing');    // 触发入场动画
  if(seat===0){
    el.dataset.uid=card.uid;
    el.onclick=()=>toggleCard(card.uid);
  }
  cont.appendChild(el);
  updateHcnts();
}

/**
 * 全量重新渲染所有 AI 手牌（排序后调用，如喊牌/反牌后）
 * 座位1→right，2→top，3→left
 */
function renderAllHands(){
  [[1,'right'],[2,'top'],[3,'left']].forEach(([seat,p])=>{
    const cont=document.getElementById(`hand-${p}`);cont.innerHTML='';
    G.hands[seat].forEach(c=>cont.appendChild(mkCard(c,false)));
  });
  renderMyHand();updateHcnts();
}

/**
 * 全量重新渲染人类手牌（含选中状态和提示高亮）
 */
function renderMyHand(){
  const cont=document.getElementById('hand-bottom');cont.innerHTML='';
  // 当前提示（循环取前一个，因为 hintIdx 已经 +1）
  const curHint=hintList.length?hintList[(hintIdx-1+hintList.length)%hintList.length]:null;
  for(const c of G.hands[0]){
    const el=mkCard(c,true);el.dataset.uid=c.uid;
    if(sel.includes(c.uid)) el.classList.add('sel');          // 选中：上移
    if(curHint?.find(x=>x.uid===c.uid)) el.classList.add('hint-hl'); // 提示：金边
    el.onclick=()=>toggleCard(c.uid);
    cont.appendChild(el);
  }
}

/**
 * 增量更新某个座位的手牌显示（出牌后移除已出的牌）
 * 比全量渲染更高效，避免不必要的 DOM 重建
 */
function updateHandDisplay(seat){
  if(seat===0){renderMyHand();updateHcnts();return;}
  const ids=[null,'hand-right','hand-top','hand-left'];
  const cont=document.getElementById(ids[seat]);if(!cont) return;
  cont.innerHTML='';
  G.hands[seat].forEach(c=>cont.appendChild(mkCard(c,false)));
  updateHcnts();
}

/** 更新所有玩家手牌数量显示 */
function updateHcnts(){
  for(let i=0;i<4;i++){
    const el=document.getElementById(`hc-${i}`);
    if(el) el.textContent=`${G.hands[i]?.length||0}张`;
  }
}

/**
 * 切换手牌选中状态（点击切换 sel 数组中的 uid）
 * 只在出牌阶段且轮到人类时响应
 */
function toggleCard(uid){
  if(G.phase!=='play'||G.turnOrder[G.turnIdx]!==0) return;
  SFX.pick();
  hintList=[];hintIdx=0; // 选牌时重置提示（避免提示与手选混淆）
  const i=sel.indexOf(uid);
  if(i>=0) sel.splice(i,1); // 已选则取消
  else sel.push(uid);        // 未选则添加
  renderMyHand();
}

/*
 * 子轮出牌展示区布局（CSS Grid 位置对应）：
 *   seat0 → rp-bottom（你，底部）
 *   seat1 → rp-right （AI一，右侧）
 *   seat2 → rp-top   （AI二，顶部）
 *   seat3 → rp-left  （AI三，左侧）
 */
const SEAT_POS={0:'rp-bottom',1:'rp-right',2:'rp-top',3:'rp-left'};

/**
 * 在中央出牌区显示某玩家本轮出的牌
 * 若该玩家格子已存在则直接覆盖（每轮出牌后重置）
 */
function showSubPlay(seat,cards){
  const area=document.getElementById('round-plays');
  const cls=SEAT_POS[seat];
  let cell=area.querySelector('.'+cls);
  if(!cell){
    cell=document.createElement('div');
    cell.className='rplay '+cls;
    area.appendChild(cell);
  }
  cell.innerHTML='';
  const meta=document.createElement('div');meta.className='rplay-meta';
  meta.textContent=pname(seat);
  const pile=document.createElement('div');pile.className='rplay-pile';
  cards.forEach(c=>pile.appendChild(mkCard(c,true)));
  cell.appendChild(meta);cell.appendChild(pile);
}

/** 高亮本轮获胜者的牌堆（金色光晕） */
function highlightSubWinner(seat){
  const area=document.getElementById('round-plays');
  area.querySelectorAll('.rplay').forEach(el=>el.classList.remove('win-hl'));
  const cell=area.querySelector('.'+SEAT_POS[seat]);
  if(cell) cell.classList.add('win-hl');
}

// ── UI 工具函数 ──

/** 更新状态栏文字（支持 HTML，可含 <b> 标签） */
function setStatus(html){document.getElementById('statusbar').innerHTML=html;}

/** 更新顶栏副主显示（null=正主，有花色则金色显示） */
function setSubDisplay(suit){
  const el=document.getElementById('c-sub');
  el.textContent=suit||'正主';
  el.className='cv '+(suit?'gold':'');
}

/** 设置轮到出牌的玩家（显示蓝点 + 名牌蓝边框） */
function setActiveDot(seat){
  for(let i=0;i<4;i++){
    document.getElementById(`td-${i}`).classList.add('hide');
    document.getElementById(`pt-${i}`).classList.remove('active');
  }
  if(seat>=0){
    document.getElementById(`td-${seat}`).classList.remove('hide');
    document.getElementById(`pt-${seat}`).classList.add('active');
  }
}

/** 显示玩家角色标签（喊牌/反牌） */
function showRolePill(seat,text,cls){
  const el=document.getElementById(`pr-${seat}`);
  el.textContent=text;el.className='rpill '+cls;el.classList.remove('hide');
}

/** 更新所有玩家得分显示（含顶栏人类得分和累计差值） */
function updateScoreUI(){
  for(let i=0;i<4;i++)
    document.getElementById(`ps-${i}`).textContent=`${G.scores[i]}分`;
  document.getElementById('c-score').textContent=G.scores[0]+'分';
  const c=cumScores[0];
  const el=document.getElementById('c-cum');
  el.textContent=(c>=0?'+':'')+c;
  el.className='cv '+(c>0?'pos':c<0?'neg':'');
}

/** 手牌区抖动动画（出牌非法时触发反馈） */
function shakeHand(){
  const h=document.getElementById('hand-bottom');
  h.classList.remove('shake');
  void h.offsetWidth; // 强制重排，触发动画重置
  h.classList.add('shake');
  setTimeout(()=>h.classList.remove('shake'),300);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块十九：Toast 提示系统
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/**
 * 显示浮动提示
 * @param {string} msg  - 提示文字
 * @param {number} dur  - 显示时长（ms），默认 2000
 * @param {string} cls  - 样式类：'tgold'|'tred'|'tgreen'
 */
function toast(msg,dur,cls){
  if(typeof dur==='string'){cls=dur;dur=2000;} // 支持 toast(msg,'tred') 简写
  dur=dur||2000;
  const area=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast '+(cls==='tred'?'tred':cls==='tgreen'?'tgreen':cls==='tgold'?'tgold':'');
  el.textContent=msg;
  area.appendChild(el);
  setTimeout(()=>{
    el.classList.add('out'); // 触发淡出动画
    setTimeout(()=>el.remove(),220);
  },dur);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  模块二十：结算界面
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/**
 * 显示本局结算界面
 * @param {Array} deltas - 各玩家得分与基准(60)的差值
 */
function showEndScreen(deltas){
  document.getElementById('action-bar').classList.add('hide');
  const md=deltas[0]; // 人类玩家的差值
  const isTop=md===Math.max(...deltas);
  // 根据胜负选择 emoji 和标题
  document.getElementById('e-emoji').textContent=isTop?'🎉':md>0?'😊':md<0?'😔':'😐';
  const t=document.getElementById('e-title');
  t.textContent=isTop?'你赢了！':md>0?'小胜':md===0?'持平':'你输了';
  t.className='etitle '+(md>0?'win':md<0?'lose':'tie');
  document.getElementById('e-sub').textContent=`下一局首出：${pname(G.highScore)}（得分最高）`;
  // 填充得分表
  const tb=document.getElementById('e-tbody');tb.innerHTML='';
  for(let i=0;i<4;i++){
    const d=deltas[i];
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="${i===0?'you':''}">${pname(i)}</td><td>${G.scores[i]}</td><td class="${d>0?'pos':d<0?'neg':''}">${d>=0?'+':''}${d}</td><td class="${cumScores[i]>0?'pos':cumScores[i]<0?'neg':''}">${cumScores[i]>=0?'+':''}${cumScores[i]}</td>`;
    tb.appendChild(tr);
  }
  if(md>0) SFX.win(); else if(md<0) SFX.lose();
  document.getElementById('endlay').classList.remove('hide');
}

function nextRound(){document.getElementById('endlay').classList.add('hide');newRound();}
function backLobby(){
  document.getElementById('endlay').classList.add('hide');
  document.getElementById('game').classList.add('hide');
  document.getElementById('lobby').classList.remove('hide');
}
